name: Claude Issue Analyzer

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  analyze-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare issue context
        id: context
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ACTION: ${{ github.event.action }}
        run: |
          cat > /tmp/issue_context.txt <<'EOF'
          TITLE: $ISSUE_TITLE
          BODY: $ISSUE_BODY
          EOF
          echo "context_file=/tmp/issue_context.txt" >> $GITHUB_OUTPUT

      - name: Analyze issue with Claude
        id: analyze
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Eres un asistente experto que analiza issues de un repositorio de un juego Tetris en HTML5/CSS3/JavaScript vanilla.

            ## Contexto del Proyecto
            **Arquitectura:** 3 ficheros, sin build step, sin dependencias externas.
            - `index.html` — 58 líneas: dos canvas (tablero 300×600px, preview 120×120px), sidebar con score/lines/level, overlay para pausa/game-over
            - `style.css` — 165 líneas: tema dark arcade (#0f0f17 fondo, #7aa2f7 accent)
            - `game.js` — 305 líneas: lógica completa del juego

            **Funciones clave de game.js:**
            - `createBoard()` — Inicializa grid 20×10 vacío
            - `collide(shape, ox, oy)` — Detecta colisiones pieza/pared/suelo
            - `rotateCW(shape)` — Rotación 90° clockwise
            - `tryRotate()` — Intenta rotación con wall kicks (±1, ±2 columnas)
            - `merge()` — Fija pieza en tablero
            - `clearLines()` — Detecta/elimina filas completas
            - `ghostY()` — Calcula landing position (ghost piece)
            - `hardDrop()` / `softDrop()` — Drop con scoring
            - `loop(ts)` — Game loop principal (accumulator pattern)
            - `draw()` — Renderiza tablero, grid, ghost, pieza activa
            - `drawNext()` — Preview de siguiente pieza

            **Constantes:**
            - COLS=10, ROWS=20, BLOCK=30px
            - COLORS = 7 colores hex para piezas
            - dropInterval inicial 1000ms (disminuye ~90ms/nivel)

            ## Issue a Analizar
            ${{ github.event.issue.title }}

            Descripción:
            ${{ github.event.issue.body }}

            Acción: ${{ github.event.action }}

            ## Tu Tarea
            1. **Selecciona labels de esta lista (máx 3):**
               bug | enhancement | question | documentation | game-mechanic | UI/UX | performance | good first issue

            2. **Escribe un diagnóstico técnico:**
               - Resumen del problema (1-2 frases)
               - Funciones de game.js involucradas
               - Archivos a modificar
               - Enfoque de solución sugerido

            3. **Responde con este formato exacto (nada más):**
            ```
            LABELS: label1,label2,label3
            DIAGNOSIS: [aquí va el diagnóstico en markdown]
            ```

            No incluyas explicaciones adicionales, solo el formato anterior.

      - name: Extract labels and diagnosis
        id: extract
        env:
          CLAUDE_OUTPUT: ${{ steps.analyze.outputs.stdout }}
        run: |
          echo "$CLAUDE_OUTPUT" > /tmp/claude_response.txt

          # Extract LABELS line
          LABELS=$(grep "^LABELS:" /tmp/claude_response.txt | sed 's/^LABELS: //' || echo "")
          echo "labels=$LABELS" >> $GITHUB_OUTPUT

          # Extract DIAGNOSIS (everything after "DIAGNOSIS:" until end or next marker)
          DIAGNOSIS=$(sed -n '/^DIAGNOSIS: /,/^[A-Z]/p' /tmp/claude_response.txt | sed '1s/^DIAGNOSIS: //' | sed '$d' || echo "")
          {
            echo "diagnosis<<EOF"
            echo "$DIAGNOSIS"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create labels and apply
        run: |
          # Create all possible labels
          gh label create bug --color d73a4a --force 2>/dev/null || true
          gh label create enhancement --color a2eeef --force 2>/dev/null || true
          gh label create question --color d876e3 --force 2>/dev/null || true
          gh label create documentation --color 0075ca --force 2>/dev/null || true
          gh label create game-mechanic --color e4e669 --force 2>/dev/null || true
          gh label create UI/UX --color f9d0c4 --force 2>/dev/null || true
          gh label create performance --color ff6b6b --force 2>/dev/null || true
          gh label create "good first issue" --color 7057ff --force 2>/dev/null || true

          # Apply determined labels
          if [ -n "${{ steps.extract.outputs.labels }}" ]; then
            gh issue edit ${{ github.event.issue.number }} --add-label "${{ steps.extract.outputs.labels }}" 2>/dev/null || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post diagnosis comment
        if: steps.extract.outputs.diagnosis != ''
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "## 🔍 Diagnóstico Automático

          ${{ steps.extract.outputs.diagnosis }}

          ---
          *Análisis generado automáticamente por Claude.*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
